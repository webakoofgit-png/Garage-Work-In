<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16171A"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF551C"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF3D00" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Container Background -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#26282E" stroke-width="12"/>
  
  <!-- Outer Accent Speed Slash Ring -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#orangeGrad)" stroke-width="6" opacity="0.8"/>
  
  <!-- GWI Typography Emblem -->
  <g filter="url(#glow)">
    <!-- Stylized G -->
    <path d="M 165 170 C 130 170 100 200 100 256 C 100 312 130 342 165 342 C 200 342 220 315 220 280 L 165 280 L 165 245 L 255 245 C 257 295 230 377 165 377 C 90 377 60 315 60 256 C 60 197 95 135 165 135 C 215 135 245 165 255 190 L 218 208 C 208 190 190 170 165 170 Z" fill="#FFFFFF"/>
    
    <!-- Stylized W -->
    <path d="M 255 140 L 285 140 L 315 310 L 340 175 L 368 175 L 393 310 L 423 140 L 452 140 L 415 372 L 382 372 L 354 235 L 326 372 L 293 372 Z" fill="#FFFFFF"/>
    
    <!-- Stylized I (Electric Orange Highlight) -->
    <rect x="440" y="140" width="32" height="232" rx="12" fill="url(#orangeGrad)"/>
  </g>
  
  <!-- Small Racing Dot Indicator -->
  <circle cx="456" cy="112" r="14" fill="#00E676"/>
</svg>